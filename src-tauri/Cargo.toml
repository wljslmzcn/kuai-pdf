[package]
name = "kuai-pdf"
version = "0.1.0"
description = "快PDF - 本地PDF处理工具"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "kuai_pdf_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.34"
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"
flate2 = "1.0"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
encoding_rs = "0.8"
